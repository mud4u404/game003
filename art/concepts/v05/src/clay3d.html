<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<style>

.phone{position:relative;width:390px;height:844px;overflow:hidden}

</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
</head>
<body>
<div class="phone" id="phone">
<div class="bar top"><div><b>仁和医院</b><br><span>第 12 天 · 周三 10:42</span></div><span style="font-size:14px">¥386,200</span></div>
<div class="bar nav">
<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"><path d="M4 21V8l8-4 8 4v13z"/><path d="M12 8v6M9 11h6M10 21v-4h4v4"/></svg>
<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9zM8.5 11h7M8.5 15h5"/></svg>
<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"><path d="M3 21h18M5 21V11h6v10M13 21V5h6v16"/></svg>
<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2a5 5 0 0 1 6 4.8"/></svg>
<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 12h7M9 16h7"/></svg>
<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 7.5 12 12l3.5-4.5M8.5 12.5h7M12 12v6"/></svg>
</div>
</div>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W=390,H=844,DPR=Number(new URLSearchParams(location.search).get('dpr')||3);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(DPR);renderer.setSize(W,H);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.NeutralToneMapping;renderer.toneMappingExposure=1.0;
document.getElementById('phone').prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#dedfdd');

// ---------- 相机：正交等轴 ----------
const Q=new URLSearchParams(location.search);
const center=new THREE.Vector3(+(Q.get('cx')||9.4),0,+(Q.get('cz')||8.4));
const view=+(Q.get('view')||15.2); // 可见宽度（米）
const cam=new THREE.OrthographicCamera(-view/2,view/2,view/2*H/W,-view/2*H/W,1,200);
cam.position.copy(center).add(new THREE.Vector3(30,44,30));cam.lookAt(center);

// ---------- 灯光 ----------
scene.add(new THREE.HemisphereLight('#ffffff','#c9ccce',1.7));
const sun=new THREE.DirectionalLight('#fffaf2',2.4);
sun.position.set(center.x-14,26,center.z-6);sun.target.position.copy(center);scene.add(sun,sun.target);
sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);sun.shadow.radius=6;sun.shadow.blurSamples=16;sun.shadow.bias=-.0004;sun.shadow.normalBias=.02;
Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20,near:1,far:80});

// ---------- 材质与构件 ----------
const M={};
const mat=(c,r=.92)=>M[c+r]||(M[c+r]=new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:0}));
const WHITE='#f7f7f5',WALL='#fafaf8',GREY='#d8d9d7',DARK='#8d9296',TEAL='#4c9690',CORAL='#e7735e',GLASS='#cfe0e3';
function add(mesh,x,y,z,parent=scene){mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;parent.add(mesh);return mesh;}
function box(w,h,d,c,x,y,z,r=.03,parent){const geo=r>0?new RoundedBoxGeometry(w,h,d,2,Math.min(r,w/2,h/2,d/2)):new THREE.BoxGeometry(w,h,d);return add(new THREE.Mesh(geo,mat(c)),x,y+h/2,z,parent);}
function cyl(r1,r2,h,c,x,y,z,parent){return add(new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,20),mat(c)),x,y+h/2,z,parent);}
function sph(r,c,x,y,z,parent,sy=1){const m=add(new THREE.Mesh(new THREE.SphereGeometry(r,24,16),mat(c)),x,y,z,parent);m.scale.y=sy;return m;}
function cap(r,len,c,x,y,z,parent){return add(new THREE.Mesh(new THREE.CapsuleGeometry(r,len,6,12),mat(c)),x,y,z,parent);}
function glass(w,h,d,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:GLASS,roughness:.1,transparent:true,opacity:.35}));m.position.set(x,y+h/2,z);scene.add(m);return m;}

// ---------- 地面 ----------
const ground=new THREE.Mesh(new THREE.PlaneGeometry(120,120),mat('#dcdddb'));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
box(22,.06,19,'#e9e9e6',8,0,8.5,0);                 // 院区铺装
box(40,.03,4.4,'#c4c6c6',8,0,20.4,0);               // 道路
for(let i=0;i<5;i++)box(.5,.035,2.8,'#f2f0ec',5.2+i*.9,0,20.4,0); // 斑马线
box(40,.05,.25,'#f2f0ec',8,0,18.2,0);
// 楼板
box(16,.08,14,'#f1f1ef',8,.06,7,0);

// 各房间地面（轻微区分）
for(const [x0,z0,x1,z1,c] of [[0,0,5,5,'#f2efea'],[5,0,10,4.5,'#edf0f1'],[10,0,16,6,'#eeeef2'],[0,5,9,14,'#f4f3f0'],[9,6,16,11,'#ecf2ef'],[9,11,16,14,'#f1f1ef']])box(x1-x0,.012,z1-z0,c,(x0+x1)/2,.14,(z0+z1)/2,0);
// ---------- 墙 ----------
const T=.18;
function wallX(x0,x1,z,h,gaps=[]){let s=x0;for(const [a,b] of [...gaps,[x1,x1]]){if(a>s)box(a-s,h,T,WALL,(s+a)/2,.14,z,.02);s=b;}}
function wallZ(z0,z1,x,h,gaps=[]){let s=z0;for(const [a,b] of [...gaps,[z1,z1]]){if(a>s)box(T,h,a-s,WALL,x,.14,(s+a)/2,.02);s=b;}}
const HB=2.5,HI=1.7,HF=.8;
wallX(0,16,0,HB);wallZ(0,14,0,HB,[[8.2,9.8]]);
// 内墙
wallX(0,5,5,HI,[[3.4,4.4]]);wallZ(0,5,5,HI);wallZ(0,4.5,10,HI);wallX(5,10,4.5,HI,[[6.8,7.8]]);
wallX(10,16,6,HI,[[10.6,11.6]]);wallZ(6,11,9,HI,[[7.4,8.4]]);wallX(9,16,11,HI,[[9.6,10.8]]);
// 前墙（剖切）
wallX(0,9,14,HF,[[5,7]]);wallZ(0,6,16,HF);wallZ(6,11,16,HF);
// 窗（背墙上的玻璃带）
for(const x of [1.2,6,11.5])glass(2.4,1.1,.05,x+1.2,1.1,.1);
glass(.05,1.1,2.4,.1,1.1,11.5);
// 大门玻璃
glass(2,2.1,.06,6,.14,14);box(.08,2.2,.12,DARK,5,.14,14,0);box(.08,2.2,.12,DARK,7,.14,14,0);

// ---------- 人物 ----------
function person(x,z,o={}){const g=new THREE.Group();const top=o.top||'#8a96a3',leg=o.leg||'#6f757c',skin=o.skin||'#efe8df';
 const seat=o.pose==='seat';
 if(!seat){cap(.085,.62,leg,-.1,.4,0,g);cap(.085,.62,leg,.1,.4,0,g);}
 else{const t=cap(.085,.36,leg,-.1,.5,.2,g);t.rotation.x=Math.PI/2;const t2=cap(.085,.36,leg,.1,.5,.2,g);t2.rotation.x=Math.PI/2;cap(.075,.3,leg,-.1,.25,.4,g);cap(.075,.3,leg,.1,.25,.4,g);}
 const by=seat?.95:1.22;
 cap(.19,o.coat&&!seat?.5:.34,top,0,by,0,g).scale.set(1,1,.72);
 cap(.06,.44,top,-.25,by+.02,0,g);cap(.06,.44,top,.25,by+.02,0,g);
 sph(.13,skin,0,by+.47,0,g,1.1);
 g.position.set(x,.14,z);g.rotation.y=o.rot||0;scene.add(g);return g;}
const DOC={top:'#fbfaf8',leg:'#6c737b',coat:1},NUR={top:TEAL,leg:'#3f7f7a'},TEC={top:'#6f8fb2',leg:'#566b83'};
const PT=[{top:'#b9a48e'},{top:'#8e9aa6'},{top:'#a8b39a'},{top:'#c2a58f'},{top:'#9d98ab'},{top:'#aeb6b8'}];

// ---------- 诊室 ----------
box(1.5,.74,.75,WHITE,2.6,.14,2.3);box(.5,.34,.04,DARK,2.6,.88,2.05,.01);box(.36,.02,.26,'#e9e6e0',2.95,.88,2.35,0);
box(.5,.45,.5,GREY,2.6,.14,1.55,.08);person(2.6,1.55,{...DOC,pose:'seat'});
box(.5,.45,.5,GREY,2.6,.14,3.15,.08);const sel=person(2.6,3.15,{...PT[0],pose:'seat',rot:Math.PI});
box(.72,.62,1.95,WHITE,.7,.14,3.6,.06);box(.6,.1,.4,'#ffffff',.7,.76,2.85,.05);
box(1.6,.9,.55,WHITE,1.6,.14,.4);box(.8,.9,.55,WHITE,4.1,.14,.4);box(.4,.02,.3,'#dfe7ea',4.1,1.04,.4,0);
sph(.32,'#dfe4dc',4.5,.95,4.5);cyl(.18,.15,.5,GREY,4.5,.14,4.5);

// ---------- 检验科 ----------
box(4.4,.9,.62,WHITE,7.5,.14,.45);
box(.55,.45,.45,'#e9eaea',6.2,1.04,.45,.05);box(.7,.38,.45,'#e9eaea',7.3,1.04,.45,.05);box(.38,.25,.38,DARK,8.3,1.04,.45,.05);
for(let i=0;i<5;i++)cyl(.03,.03,.14,['#e7735e','#6f9fbf','#d8b36a','#8fb08a','#a494bf'][i],8.8+i*.08,1.04,.35);
box(.75,1.9,.65,'#f2f1ee',9.35,.14,.5,.04);
box(2.6,.9,.75,WHITE,7.4,.14,2.6);box(.6,.4,.45,'#e9eaea',6.7,1.04,2.6,.05);box(.34,.28,.04,DARK,7.8,1.04,2.45,.01);
person(7.6,3.3,{...TEC,rot:Math.PI});
box(.55,.5,.55,GREY,5.8,.14,3.8,.08);person(5.8,3.8,{...PT[3],pose:'seat',rot:Math.PI/2});

// ---------- 放射科 ----------
box(.9,.75,2.3,WHITE,12.2,.14,2.9,.05);box(.8,.08,2.1,'#e6ebee',12.2,.89,2.9,.04);
{const g=person(0,0,{...PT[1]});g.rotation.x=-Math.PI/2;g.position.set(12.2,1.08,3.8);}
box(.25,2.55,.25,GREY,13.1,.14,1.2);box(1.1,.2,.22,GREY,12.6,2.5,1.2);box(.2,.7,.2,GREY,12.2,1.8,1.35);box(.55,.35,.45,'#f2f1ee',12.2,1.5,1.5,.06);
box(.7,1.7,.2,'#f2f1ee',15.3,.14,.3,.04);
// 铅玻璃控制间
wallZ(3.8,6,13.6,HI,[[4.2,5.8]]);glass(.06,1.2,1.6,13.6,1,5);box(1.8,.75,.6,WHITE,14.9,.14,4.6);
box(.5,.32,.04,DARK,14.6,.89,4.4,.01);box(.5,.32,.04,DARK,15.2,.89,4.4,.01);person(14.9,5.3,{...TEC,rot:Math.PI});
person(11.4,4.9,{...TEC,rot:-Math.PI/4});

// ---------- 大厅 ----------
box(3.2,1.05,.7,WHITE,2.2,.14,6.6,.08);box(.7,1.05,1.4,WHITE,.95,.14,7.6,.08);box(3.2,.03,.05,'#7fc2bb',2.2,.4,6.96,0);
box(.46,.3,.04,DARK,1.8,1.19,6.45,.01);person(2.4,6.0,{...NUR,rot:0});person(2.5,7.5,{...PT[4],rot:Math.PI});
function bench(x,z,n,who){box(n*.62,.08,.55,GREY,x,.55,z,0);for(let i=0;i<n;i++){box(.52,.06,.5,'#e3e1dc',x-(n-1)*.31+i*.62,.63,z,.03);box(.52,.5,.06,'#e3e1dc',x-(n-1)*.31+i*.62,.69,z-.25,.03);}
 box(.08,.55,.4,'#b9bcbd',x-n*.31+.1,.14,z,0);box(.08,.55,.4,'#b9bcbd',x+n*.31-.1,.14,z,0);
 who.forEach((p,i)=>{if(p>=0)person(x-(n-1)*.31+i*.62,z,{...PT[p],pose:'seat'});});}
bench(3.2,9.4,4,[2,-1,-1,5]);bench(3.2,11,4,[-1,1,-1,-1]);bench(3.2,12.6,4,[4,-1,3,-1]);
person(6.3,8.6,{...NUR,rot:.8});person(7.2,11.8,{...PT[1],rot:2.4});person(5.4,10.4,{...DOC,rot:-.6});
for(const [x,z] of [[.6,13.4],[7.6,5.5],[4.6,5.6]]){cyl(.2,.16,.45,GREY,x,.14,z);sph(.34,'#dfe4dc',x,.95,z);}
// 导向线
box(.2,.012,7.6,'#5fb0a8',7.3,.155,9.6,0);box(3.1,.012,.2,'#5fb0a8',8.8,.155,5.9,0);

// ---------- 病房 ----------
function bed(x,z,p){box(.95,.5,2.05,WHITE,x,.14,z,.05);box(.88,.14,1.95,'#ffffff',x,.64,z,.05);box(.6,.1,.35,'#ffffff',x,.78,z-.72,.05);
 box(.9,.08,1.2,'#dbe3e6',x,.76,z+.3,.04);sph(.13,'#efe8df',x,.9,z-.62);box(1.0,.35,.06,DARK,x,.5,z-1.05,.02);}
bed(10.4,8.3,0);bed(12.4,8.3,2);bed(14.4,8.3,5);
for(const x of [11.4,13.4])box(.45,.7,.45,'#efedea',x,.14,7.5,.04);
for(const x of [11.45,13.45]){box(.02,1.2,1.3,'#eef2f2',x,.55,8.8,.005);}
cyl(.02,.02,1.7,DARK,15.5,.14,7.4);box(.14,.2,.06,'#dfe9ec',15.5,1.6,7.4,.02);
person(12.6,9.9,{...NUR,rot:Math.PI*.9});

// ---------- 急诊入口 ----------
box(4.2,.16,1.5,'#f7f7f5',12.6,2.35,14.75,.03);box(4.2,.36,.1,CORAL,12.6,2.15,15.5,.02);
box(.3,.08,.02,'#ffffff',12.6,2.29,15.56,0);box(.08,.3,.02,'#ffffff',12.6,2.18,15.56,0);
for(const x of [10.7,14.5])box(.14,2.2,.14,WALL,x,.14,15.35,.02);
glass(3,2.1,.06,12.6,.14,14);
{const g=person(12.1,15.3,{...NUR,rot:Math.PI});const s=box(.7,.12,1.9,'#f2f1ee',12.6,.8,15.6,.04);box(.6,.1,1.8,'#ffffff',12.6,.92,15.6,.04);box(.05,.66,.05,DARK,12.35,.14,14.9,0);box(.05,.66,.05,DARK,12.85,.14,16.3,0);person(13.1,16.5,{...NUR,rot:0});}

// ---------- 救护车 ----------
{const g=new THREE.Group();scene.add(g);
 box(2.1,2.1,3.6,'#fbfbfa',0,.35,0,.18,g);box(2.0,1.4,1.2,'#fbfbfa',0,.35,2.3,.2,g);box(1.8,.55,.05,'#9fb4bb',0,1.15,2.92,.02,g);
 box(2.12,.28,3.62,CORAL,0,1.05,0,.02,g);box(2.02,.2,1.22,CORAL,0,.95,2.3,.02,g);box(.5,.12,.02,'#ffffff',0,1.12,-1.82,0,g);
 for(const [x,z] of [[-1,1.9],[1,1.9],[-1,-1.1],[1,-1.1]]){const w=add(new THREE.Mesh(new THREE.CylinderGeometry(.36,.36,.26,24),mat('#4b4f55')),x,.36,z,g);w.rotation.z=Math.PI/2;}
 box(.8,.12,.3,'#d9e6f2',0,2.45,.6,.04,g);
 g.position.set(14.2,0,19.2);g.rotation.y=Math.PI*.5;}

// ---------- 室外：树、花坛、护柱 ----------
function tree(x,z,s=1){cyl(.08*s,.12*s,1.4*s,'#d9d5ce',x,.06,z);for(const [dx,dy,dz,r] of [[0,2.1,0,.95],[.5,1.8,.3,.7],[-.45,1.9,-.2,.75],[.1,2.6,-.1,.65],[-.2,1.6,.5,.6]])sph(r*s,'#f3f1ed',x+dx*s,dy*s,z+dz*s);}
tree(-2.5,2);tree(-2,8,1.1);tree(-2.8,13.5);tree(4,-2.6,1.1);tree(11,-2.8);tree(18.6,3.5,1.1);tree(18.4,10);tree(1,17,1.2);tree(-1.5,18.8);
function planter(x,z,w,d){box(w,.45,d,'#eeece7',x,.06,z,.04);for(let i=0;i<Math.round(w*d*2.2);i++){const u=(i*.618)%1,v=(i*.377)%1;sph(.22+.1*((i*.29)%1),'#e4e7df',x-w/2+.25+u*(w-.5),.62,z-d/2+.25+v*(d-.5));}}
planter(2,15.2,3,1);planter(7.8,15.2,1.6,1);planter(17.5,13,1,3);
for(const x of [9.2,10.2,15.8])cyl(.09,.09,.8,'#c9c6c0',x,.06,17.8);

// ---------- 后期：环境光遮蔽 ----------
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,cam));
const ao=new GTAOPass(scene,cam,W,H);ao.output=GTAOPass.OUTPUT.Default;
ao.updateGtaoMaterial({radius:.9,distanceExponent:1.4,thickness:1.2,scale:1.1,samples:16});
ao.updatePdMaterial({lumaPhi:10,depthPhi:2,normalPhi:3,radius:6,rings:2,samples:16});
composer.addPass(ao);composer.addPass(new OutputPass());
composer.setPixelRatio(DPR);composer.setSize(W,H);
composer.render();

// 选中患者名牌
const v=new THREE.Vector3(2.6,2.1,3.15).project(cam);
const tag=document.createElement('div');tag.className='tag';tag.textContent='王建国 · III 级';
tag.style.left=((v.x+1)/2*W)+'px';tag.style.top=((1-v.y)/2*H)+'px';document.getElementById('phone').append(tag);
window.__done=true;
</script>
</body>
</html>
