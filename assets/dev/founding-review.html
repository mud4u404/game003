<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#edf0e5"><title>筹建独立验收 · 不读取玩家存档</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main id="game" aria-label="梅奥诊所实时模拟">
<canvas id="scene" tabindex="0" aria-label="诊所场景。拖动平移，滚轮或双指缩放。可以通过下方团队按钮查看人物。"></canvas>
<header class="hud">
<div class="identity"><span class="emblem" aria-hidden="true">✚</span><div><h1>梅奥<span>诊所</span></h1><p>青禾镇 · 城郊社区</p></div></div>
<div class="status"><span class="live"><i></i><span id="live-label">自主运行</span></span><span class="day" id="day">第 1 天</span><time id="clock">--:--</time><span class="cash" id="cash">¥180,000</span></div>
</header>

<div id="notice" class="notice" role="status" hidden></div>
<section id="founding" aria-label="诊所筹建" hidden></section>
<aside id="panel" class="panel" aria-label="诊所信息" hidden></aside>
<aside id="person" class="person" aria-label="人物信息" hidden></aside>
<div class="scene-caption" id="hint">拖动观察 · 点选人物 · 双指缩放</div>
<footer class="controls">
<nav aria-label="诊所管理"><button data-panel="hospital" class="nav-button"><svg viewBox="0 0 24 24"><path d="M4 21V8h16v13M9 8V3h6v5M9 21v-6h6v6M2 21h20M11 5h2M7 11h1m3 0h2m3 0h1"/></svg><span>诊所</span></button><button data-panel="team" class="nav-button"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M17 5a3 3 0 0 1 0 6m1 4a5 5 0 0 1 3 5"/></svg><span>团队</span></button><button data-panel="director" class="nav-button"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="16" rx="2"/><path d="M9 5V3h6v2M9 10h6M9 14h6M9 18h3"/></svg><span>院长</span><i id="director-dot" hidden></i></button><button data-panel="journal" class="nav-button"><svg viewBox="0 0 24 24"><path d="M5 3h14v18H5zM9 8h6M9 12h6M9 16h4"/></svg><span>院务</span></button></nav>
<div class="view-controls"><button id="sound" aria-label="开启声音" aria-pressed="false">♫</button><button id="zoom-out" aria-label="缩小">−</button><button id="reset-view" aria-label="回到全景"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M8 8h8v8H8z"/></svg></button><button id="zoom-in" aria-label="放大">+</button></div>
</footer>
<div class="prototype">筹建原型 0.3 · 本地档案</div>
</main>
<div style="position:fixed;left:4px;top:4px;z-index:20;background:#fff;padding:5px;font-size:10px"><label>独立夹具 · 无存档</label><button id="ready-test">定位筹建完成</button><button id="operate-test">定位工作日营业</button></div>
<script type="module" src="./founding-review.js"></script>
</body></html>
