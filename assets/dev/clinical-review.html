<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>诊疗与扩建验收 · 独立场景</title>
<style>*{box-sizing:border-box}body{margin:0;background:#29343e;color:#e8eceb;font:14px system-ui}main{max-width:460px;margin:auto}header{padding:12px}h1{font-size:17px;margin:0 0 6px}p{margin:4px 0;color:#b7c4cd;font-size:12px}canvas{width:100%;height:68vh;display:block;touch-action:none}nav{display:flex;flex-wrap:wrap;gap:6px;padding:10px}button{background:#465e73;color:white;border:1px solid #7b8c98;border-radius:5px;min-height:40px;padding:5px 10px}pre{white-space:pre-wrap;padding:12px;margin:0;font:12px/1.7 system-ui}</style>
<main><header><h1>诊疗与扩建验收</h1><p>独立固定病例 · 不读写玩家存档 · 时间定位仅供开发验证</p><p id="status"></p></header><canvas id="scene" tabindex="0" aria-label="诊疗验收场景"></canvas><nav id="stages"></nav><nav><button id="play">播放</button><button id="focus">跟随患者</button><button id="all">全院</button><button id="annex">相邻单元</button></nav><pre id="record"></pre></main>
<script type="module">
import {createState,advanceTo,applyManagementAction,MINUTE,HOUR} from '/src/simulation.js';
import {newClinicalCase,clinicalStatus,DAY} from '/src/medical.js';import {ClinicScene} from '/src/scene.js';
const start=1790000000000;let state,playing=false,follow=false,last=performance.now();
function initial(type='workup',expanded=false){const s=createState(start);s.patients=[s.patients[0]];s.patients[0].clinical=newClinicalCase(s.patients[0],type);s.patients[0].clinical.variation={abnormalReport:false,persistent:false};s.nextArrival=start+40*DAY;s.nextReview=start+40*DAY;s.authority=false;if(expanded){applyManagementAction(s,{action:'buildAnnex'},'investor');s.patients[0].motion.start+=HOUR;s.patients[0].motion.end+=HOUR;s.patients[0].motion.ready+=HOUR;s.patients[0].motion.at+=HOUR;s.patients[0].serviceAt+=HOUR;s.patients[0].motionDue+=HOUR;s.patients[0].due+=HOUR;}return s;}
const scene=new ClinicScene(document.querySelector('canvas'),id=>{scene.selected=id;renderRecord();},()=>{follow=false});
function renderRecord(){const p=state.patients.find(p=>p.id===scene.selected)||state.patients[0],r=state.medical.records[0];document.querySelector('#status').textContent=Math.round((state.time-start)/MINUTE)+' 分钟 · '+(p?clinicalStatus(p,state.time):r?.clinical.outcome||'尚无患者');document.querySelector('#record').textContent=JSON.stringify({状态:p?.phase,记录:p?.clinical?.trail||r?.clinical.trail,统计:state.medical.stats,现金:state.cash,外检安排:state.medical.lab},null,2);}
function seek(type,at,expanded=false,abnormal=false){state=initial(type,expanded);state.patients[0].clinical.variation.abnormalReport=abnormal;advanceTo(state,start+at);scene.selected=state.patients[0]?.id||null;playing=false;document.querySelector('#play').textContent='播放';scene.expanded=state.medical.annex;scene.reset();renderRecord();}
const stages=[['测量评估','pressure',7*MINUTE],['医生问诊','workup',10*MINUTE],['采样交接','workup',15*MINUTE],['报告待复核','workup',255*MINUTE],['异常报告后续','workup',6*HOUR,false,true],['处方与药房','pressure',2*HOUR],['急救接续','urgent',MINUTE],['七天随访','respiratory',8*DAY],['相邻单元采样','workup',75*MINUTE,true]];
for(const [label,...args] of stages){const b=document.createElement('button');b.textContent=label;b.onclick=()=>seek(...args);document.querySelector('#stages').append(b);}
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'暂停':'播放';};document.querySelector('#focus').onclick=()=>{follow=true;};document.querySelector('#all').onclick=()=>{follow=false;scene.reset();};document.querySelector('#annex').onclick=()=>{follow=false;scene.focusAnnex();};seek('workup',15*MINUTE);
function draw(now){if(playing){advanceTo(state,state.time+now-last);renderRecord();}last=now;if(follow&&state.patients[0])scene.focus(state.patients[0].id,state);scene.draw(state,state.time);requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></html>
